<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a0e13">
<meta name="description" content="CodeForge — editor kode Monaco untuk web & Android">
<title>CodeForge</title>
<link rel="icon" type="image/png" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<style>
:root{
  --bg:#0d1117;--sd:#10151c;--br:#0a0e13;--fg:#c9d1d9;--mu:#7d8590;
  --ac:#7c5cff;--a2:#22d3ee;--bd:#202833;--hv:#1a212b;--ok:#3fb950;--er:#f85149;
}
body.l{
  --bg:#fff;--sd:#f6f8fa;--br:#eef1f5;--fg:#24292f;--mu:#6e7781;
  --ac:#6246ea;--a2:#0891b2;--bd:#d8dee4;--hv:#e6eaef;--ok:#1a7f37;--er:#cf222e;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{
  display:flex;flex-direction:column;background:var(--br);color:var(--fg);
  font:13px Inter,system-ui,-apple-system,sans-serif;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
}
button,select,input{font:inherit;color:inherit}
button{background:0;border:0;padding:7px 10px;border-radius:8px;cursor:pointer;white-space:nowrap}
button:hover{background:var(--hv)}
button:disabled{opacity:.45;cursor:default}
input,select{
  background:var(--hv);border:1px solid var(--bd);border-radius:8px;padding:7px 9px;width:100%;
}
select option{background:var(--sd)}
label{display:grid;gap:4px;font-size:12px;color:var(--mu)}
#top{
  display:flex;align-items:center;gap:2px;padding:5px 8px;
  border-bottom:1px solid var(--bd);overflow-x:auto;flex-shrink:0;
}
#top::-webkit-scrollbar{height:0}
#top b{
  padding:0 8px;background:linear-gradient(90deg,var(--ac),var(--a2));
  -webkit-background-clip:text;background-clip:text;color:transparent;font-size:15px;
}
.sp{flex:1}
#main{flex:1;display:flex;min-height:0;position:relative}
#act{
  width:46px;background:var(--br);border-right:1px solid var(--bd);
  display:flex;flex-direction:column;align-items:center;padding-top:6px;gap:4px;flex-shrink:0;
}
#act button{width:38px;height:38px;padding:0}
#act button.on{background:var(--hv)}
#side{
  width:260px;background:var(--sd);border-right:1px solid var(--bd);
  overflow:auto;padding:8px 0;flex-shrink:0;
}
.ph{
  display:flex;align-items:center;margin:0 10px 8px 14px;font-size:10.5px;
  letter-spacing:.1em;color:var(--mu);font-weight:600;
}
.ph span{flex:1}
.ph button{padding:3px 6px}
.pn{display:none}.pn.on{display:block}
.pad{padding:0 12px;display:grid;gap:10px}
.it{
  display:flex;gap:7px;align-items:center;margin:1px 6px;padding:5px 9px;
  border-radius:7px;cursor:pointer;white-space:nowrap;overflow:hidden;
}
.it span{overflow:hidden;text-overflow:ellipsis;flex:1}
.it:hover{background:var(--hv)}
.it.on{background:#7c5cff2a;box-shadow:inset 2px 0 var(--ac)}
.it .rm{opacity:0;font-size:11px;padding:2px 5px}
.it:hover .rm{opacity:1}
details>summary{padding:5px 14px;cursor:pointer;list-style:none;color:var(--mu)}
details>summary::-webkit-details-marker{display:none}
details>div{padding-left:9px}
#ed{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
#tabs{
  display:flex;background:var(--br);overflow-x:auto;min-height:36px;
  align-items:flex-end;padding:4px 5px 0;gap:2px;flex-shrink:0;
}
#tabs::-webkit-scrollbar{height:0}
.tab{
  display:flex;align-items:center;gap:7px;padding:8px 8px 8px 11px;
  border-radius:9px 9px 0 0;cursor:pointer;white-space:nowrap;color:var(--mu);max-width:210px;
}
.tab span{overflow:hidden;text-overflow:ellipsis}
.tab.on{background:var(--bg);color:var(--fg);box-shadow:inset 0 2px var(--ac)}
.tab i{font-style:normal;font-size:11px;padding:2px 5px;border-radius:5px}
.tab i:hover{background:var(--bd)}
#box{flex:1;min-height:0;position:relative}
#empty{
  position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px;
  background:radial-gradient(500px 280px at 50% 28%,color-mix(in srgb,var(--ac) 22%,transparent),transparent 70%),var(--bg);
}
#empty h2{margin:0;font-size:20px}
#empty p{margin:0;color:var(--mu);max-width:360px;line-height:1.5}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.row button{background:var(--hv);border:1px solid var(--bd);padding:10px 15px}
#drop{
  display:none;position:absolute;inset:8px;z-index:9;border:2px dashed var(--ac);
  border-radius:14px;background:#7c5cff33;align-items:center;justify-content:center;font-size:18px;
}
#keys{
  display:none;gap:4px;padding:5px;background:var(--br);border-top:1px solid var(--bd);
  overflow-x:auto;flex-shrink:0;
}
#keys button{background:var(--hv);min-width:38px;padding:8px 6px;font:600 14px monospace}
#st{
  display:flex;gap:6px;background:var(--br);border-top:1px solid var(--bd);
  color:var(--mu);padding:3px 8px;font-size:11.5px;overflow-x:auto;white-space:nowrap;flex-shrink:0;
}
#st span{padding:2px 8px;border-radius:6px}
#st span+span{background:var(--hv)}
#st #s1{flex:1;padding:2px;overflow:hidden;text-overflow:ellipsis}
#menu{
  position:fixed;z-index:50;background:var(--sd);border:1px solid var(--bd);
  border-radius:10px;box-shadow:0 12px 40px #0009;padding:5px;min-width:240px;
  display:none;max-height:70vh;overflow:auto;
}
#menu div{
  display:flex;padding:8px 12px;border-radius:7px;cursor:pointer;
  gap:20px;justify-content:space-between;align-items:center;
}
#menu div:hover{background:var(--hv)}
#menu em{font-style:normal;color:var(--mu);font-size:11px}
#menu hr{border:0;border-top:1px solid var(--bd);margin:4px 0}
#toast{
  position:fixed;left:50%;bottom:70px;transform:translateX(-50%);
  background:var(--ac);color:#fff;padding:9px 16px;border-radius:10px;
  z-index:60;display:none;max-width:90%;text-align:center;box-shadow:0 8px 24px #0006;
}
#toast.err{background:var(--er)}
.hit{padding:5px 14px;cursor:pointer;font-size:12px;border-radius:6px;margin:0 6px}
.hit:hover{background:var(--hv)}
.hit small{color:var(--mu)}
#load{
  position:absolute;inset:0;z-index:8;display:none;align-items:center;justify-content:center;
  background:#0006;color:#fff;font-size:14px;gap:10px;
}
.spin{
  width:22px;height:22px;border:3px solid #fff4;border-top-color:#fff;
  border-radius:50%;animation:sp .7s linear infinite;
}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:800px){
  #keys{display:flex}
  #side{
    position:absolute;z-index:5;left:46px;top:0;bottom:0;width:78%;
    transform:translateX(-120%);transition:.2s;box-shadow:8px 0 30px #0008;
  }
  #side.open{transform:none}
}

/* —— Professional glowing icons —— */
.ico{
  display:inline-flex;align-items:center;justify-content:center;
  width:1.15em;height:1.15em;flex-shrink:0;vertical-align:middle;
}
.ico svg{width:100%;height:100%;display:block}
.fi{
  display:inline-flex;align-items:center;justify-content:center;
  width:18px;height:18px;border-radius:4px;font:700 9px/1 ui-monospace,Consolas,monospace;
  letter-spacing:-.02em;color:#0d1117;flex-shrink:0;
  text-shadow:none;box-shadow:0 0 0 1px #0003 inset;
}
.fi.glow{box-shadow:0 0 8px var(--gc,var(--ac)),0 0 0 1px #0003 inset}
#top b.logo{
  display:inline-flex;align-items:center;gap:7px;padding:0 8px;
  font-size:15px;font-weight:700;letter-spacing:-.01em;
  background:linear-gradient(105deg,var(--ac),var(--a2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 6px color-mix(in srgb,var(--ac) 55%,transparent));
}
#top b.logo .mark{
  width:22px;height:22px;border-radius:7px;
  background:linear-gradient(135deg,var(--ac),var(--a2));
  display:grid;place-items:center;color:#fff;font:700 11px monospace;
  box-shadow:0 0 14px color-mix(in srgb,var(--ac) 65%,transparent),
             0 0 4px color-mix(in srgb,var(--a2) 50%,transparent);
  -webkit-background-clip:border-box;background-clip:border-box;
  filter:none;
}
#act button{
  font-size:0;width:38px;height:38px;padding:0;border-radius:10px;
  color:var(--mu);position:relative;transition:color .15s,background .15s,box-shadow .2s;
}
#act button .ico{width:20px;height:20px}
#act button:hover{color:var(--fg);background:var(--hv)}
#act button.on{
  color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,transparent);
  box-shadow:inset 2px 0 0 var(--ac),0 0 16px color-mix(in srgb,var(--ac) 25%,transparent);
}
#act button.on .ico{filter:drop-shadow(0 0 5px color-mix(in srgb,var(--ac) 70%,transparent))}
#top button.tb{
  width:34px;height:32px;padding:0;border-radius:8px;color:var(--mu);
  display:inline-flex;align-items:center;justify-content:center;
}
#top button.tb .ico{width:17px;height:17px}
#top button.tb:hover{color:var(--fg);background:var(--hv)}
#top button.tb:hover .ico{filter:drop-shadow(0 0 4px color-mix(in srgb,var(--ac) 50%,transparent))}
.ph button{
  width:28px;height:26px;padding:0;border-radius:6px;color:var(--mu);
  display:inline-flex;align-items:center;justify-content:center;
}
.ph button .ico{width:15px;height:15px}
.ph button:hover{color:var(--ac);background:var(--hv)}
.ph button:hover .ico{filter:drop-shadow(0 0 4px color-mix(in srgb,var(--ac) 60%,transparent))}
.lg{
  width:84px;height:84px;border-radius:22px;display:grid;place-items:center;
  font:700 28px monospace;color:#fff;
  background:linear-gradient(135deg,var(--ac),var(--a2));
  box-shadow:0 0 40px color-mix(in srgb,var(--ac) 55%,transparent),
             0 12px 32px #0006,
             inset 0 1px 0 #fff3;
  position:relative;
}
.lg::after{
  content:'';position:absolute;inset:-3px;border-radius:25px;
  background:linear-gradient(135deg,var(--ac),var(--a2));opacity:.35;z-index:-1;
  filter:blur(10px);
}
.tab b.fi{margin-right:0}
.row button.primary{
  background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 70%,var(--a2)));
  color:#fff;border:0;
  box-shadow:0 0 20px color-mix(in srgb,var(--ac) 40%,transparent);
}
.row button.primary:hover{filter:brightness(1.08)}
#keys button{
  background:var(--hv);min-width:38px;padding:8px 6px;font:600 14px monospace;
  border:1px solid transparent;border-radius:8px;color:var(--fg);
}
#keys button:hover{
  border-color:color-mix(in srgb,var(--ac) 40%,transparent);
  box-shadow:0 0 10px color-mix(in srgb,var(--ac) 30%,transparent);
  color:var(--ac);
}
#toast{
  box-shadow:0 0 24px color-mix(in srgb,var(--ac) 45%,transparent),0 8px 24px #0006;
}
#toast.err{box-shadow:0 0 24px color-mix(in srgb,var(--er) 45%,transparent),0 8px 24px #0006}
.it .fi{box-shadow:0 0 6px var(--gc,transparent),0 0 0 1px #0003 inset}
details>summary{
  display:flex;align-items:center;gap:6px;
}
details>summary .fi-folder{
  width:16px;height:16px;color:#e3b341;
  filter:drop-shadow(0 0 4px #e3b34166);
}
body.l details>summary .fi-folder{color:#9a6700;filter:drop-shadow(0 0 3px #9a670044)}
body.l .fi{color:#fff;box-shadow:0 0 0 1px #0002 inset}
body.l #act button.on{
  box-shadow:inset 2px 0 0 var(--ac),0 0 12px color-mix(in srgb,var(--ac) 20%,transparent);
}


.tab b{display:inline-flex;align-items:center}
.it b{display:inline-flex;align-items:center}
.tab.on .fi{box-shadow:0 0 10px var(--gc,var(--ac)),0 0 0 1px #0003 inset}


/* ===== v1.2: ikon menyala, tombol besar untuk HP, preview ===== */
:root{--c1:#ffd166;--c2:#4dd0ff;--c3:#c4a8ff;--c4:#3dff9a;--c5:#ff7ab6;--c6:#ffa657}
body.l{--c1:#9a6700;--c2:#0a7ea4;--c3:#6246ea;--c4:#1a7f37;--c5:#bf3989;--c6:#bc4c00}
.ico svg{stroke-width:2.1}
.ico{filter:drop-shadow(0 0 3px color-mix(in srgb,currentColor 55%,transparent))}
body.l .ico{filter:none}
#top b.logo .lt{margin-left:0}
#act button[data-p=p1]{--ic:var(--c1)}
#act button[data-p=p2]{--ic:var(--c2)}
#act button[data-p=p3]{--ic:var(--c3)}
#act button{color:var(--ic,var(--fg))}
#act button .ico{width:22px;height:22px}
#act button.on{
  color:var(--ic,var(--ac));background:color-mix(in srgb,var(--ic,var(--ac)) 16%,transparent);
  box-shadow:inset 3px 0 0 var(--ic,var(--ac)),0 0 18px color-mix(in srgb,var(--ic,var(--ac)) 30%,transparent);
}
#act button.on .ico{filter:drop-shadow(0 0 6px var(--ic,var(--ac)))}
#top .acts{display:flex;gap:4px;align-items:center;position:sticky;right:0;padding-left:8px;background:var(--br);flex-shrink:0}
#top button.tb{color:var(--ic,var(--fg));width:38px;height:36px}
#top button.tb .ico{width:20px;height:20px}
#qs{--ic:var(--c2)}#qp{--ic:var(--c3)}#qt{--ic:var(--c1)}
.ph button{color:var(--ic,var(--fg));width:30px;height:30px}
.ph button .ico{width:18px;height:18px}
#xn{--ic:var(--c4)}#xo{--ic:var(--c2)}#xf{--ic:var(--c1)}#xz{--ic:var(--c6)}
#top button.pv,#fab{
  display:inline-flex;align-items:center;gap:7px;font-weight:700;color:#03150b;
  background:linear-gradient(135deg,#3dff9a,#22d3ee);border-radius:10px;
  box-shadow:0 0 18px #3dff9a66,inset 0 1px 0 #fff6;
}
#top button.pv{height:36px;padding:0 13px 0 10px}
#top button.pv .ico,#fab .ico{width:18px;height:18px;filter:none}
#top button.pv:hover,#fab:hover{filter:brightness(1.1);background:linear-gradient(135deg,#3dff9a,#22d3ee)}
#top button.pv:active,#fab:active{transform:scale(.95)}
#fab{
  position:absolute;right:14px;bottom:14px;z-index:12;width:54px;height:54px;border-radius:50%;
  padding:0;justify-content:center;display:none;box-shadow:0 0 24px #3dff9a88,0 8px 20px #0007;
}
#fab .ico{width:26px;height:26px}
.fi{
  width:22px;height:22px;border-radius:6px;font-size:9.5px;
  background-image:linear-gradient(155deg,#ffffff59,#0000 55%),linear-gradient(#0000,#0000002e);
}
details>summary>.ico:first-child{width:14px;height:14px;color:var(--mu);transition:transform .15s;filter:none}
details[open]>summary>.ico:first-child{transform:rotate(90deg)}
details>summary .fi-folder{width:19px;height:19px}
.tab i{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;padding:0}
.tab i .ico{width:13px;height:13px;filter:none}
.tab i:hover{background:var(--er);color:#fff}
.tab .dot{width:9px;height:9px;border-radius:50%;background:var(--a2);box-shadow:0 0 8px var(--a2)}
.tab.on{box-shadow:inset 0 3px var(--ac),0 -6px 18px -8px var(--ac)}
.it .rm{display:inline-grid;place-items:center;padding:0;width:26px;height:26px}
.it .rm .ico{width:13px;height:13px;filter:none}
.it .rm:hover{background:var(--er);color:#fff}
#menu div{gap:12px;justify-content:flex-start}
#menu div .ico{width:18px;height:18px}
#menu div .ml{flex:1}
#st #s3{cursor:pointer}
.row button.bt{display:inline-flex;align-items:center;gap:8px}
.row button .ico{width:20px;height:20px}
#bf2 .ico{color:var(--c1)}#bz2 .ico{color:var(--c6)}
/* Preview */
#pv{
  position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;background:var(--br);
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
}
#pv[hidden]{display:none}
.pvh{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid var(--bd);flex-shrink:0}
.pvt{flex:1;min-width:0;display:grid;line-height:1.3}
.pvt b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.pvt small{color:var(--mu);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pvd{display:flex;gap:2px;padding:3px;background:var(--hv);border-radius:10px}
.pvh button.tb{width:40px;height:40px;padding:0;display:inline-grid;place-items:center;border-radius:10px;color:var(--ic,var(--fg))}
.pvh button.tb .ico{width:20px;height:20px}
.pvd button.on{background:color-mix(in srgb,var(--ac) 25%,transparent);color:var(--ac)}
#pvx{--ic:var(--er)}#pvr{--ic:var(--c4)}#pvo{--ic:var(--c2)}
.pvb{
  flex:1;min-height:0;display:flex;justify-content:center;overflow:auto;background-color:var(--bg);
  background-image:radial-gradient(var(--bd) 1px,transparent 1px);background-size:16px 16px;
}
#pvf{width:100%;height:100%;border:0;background:#fff;max-width:100%;transition:width .2s}
.pvb.dev #pvf{margin:14px 0;height:calc(100% - 28px);border-radius:14px;box-shadow:0 0 0 1px var(--bd),0 18px 50px #0008}
@media(max-width:600px){.pvd{display:none}#top b.logo .lt{display:none}}
/* Tombol besar untuk layar sentuh / HP */
@media(max-width:800px),(pointer:coarse){
  body{font-size:14px}
  #keys{display:flex}
  #top{padding:6px 8px;gap:4px}
  #top button[data-m]{height:44px;padding:0 14px;font-size:14px;font-weight:600}
  #top .acts{gap:6px}
  #top button.tb{width:44px;height:44px}
  #top button.tb .ico{width:22px;height:22px}
  #top button.pv{height:44px;padding:0 14px 0 11px;font-size:14px}
  #act{width:56px;gap:6px;padding-top:8px}
  #act button{width:48px;height:48px;border-radius:12px}
  #act button .ico{width:24px;height:24px}
  .ph{margin-bottom:10px;font-size:11.5px}
  .ph button{width:42px;height:42px}
  .ph button .ico{width:21px;height:21px}
  .it{min-height:44px;padding:8px 10px;font-size:14px}
  .it .rm{opacity:.75;width:34px;height:34px}
  details>summary{min-height:44px;padding:0 14px;font-size:14px}
  #tabs{min-height:50px;padding-top:6px}
  .tab{min-height:44px;padding:0 6px 0 12px;font-size:14px;gap:8px}
  .tab i{width:32px;height:32px}
  .tab i .ico{width:15px;height:15px}
  #keys{gap:6px;padding:6px 8px}
  #keys button{min-width:46px;height:46px;font-size:17px;padding:0 10px;border-radius:10px;border-color:var(--bd)}
  #menu{min-width:260px}
  #menu div{min-height:48px;font-size:15px}
  #menu div .ico{width:20px;height:20px}
  input,select{height:46px;font-size:16px}
  input[type=checkbox]{width:22px!important;height:22px}
  .row button{min-height:50px;font-size:15px;padding:0 18px}
  .hit{padding:10px 14px;font-size:13px}
  #st{font-size:12px;padding:4px 8px}
  #st span{padding:6px 10px}
  #side{left:56px;z-index:20}
  #fab{width:58px;height:58px;right:16px;bottom:16px}
  .pvh button.tb{width:44px;height:44px}
}


/* ===== v1.3: skala ikon/teks, warna profesional, tombol geser kanan ===== */
:root{--c1:#f2c94c;--c2:#56b6f7;--c3:#b39dff;--c4:#4ade80;--c5:#f472b6;--c6:#fb923c;--is:1;--ts:1;--mu:#8b98a9;--fg:#d5dbe3}
body.l{--mu:#57606a;--fg:#24292f}
body{-webkit-font-smoothing:antialiased;letter-spacing:.005em;font-size:calc(14px*var(--ts))}
#act button,#top button.tb,#top button.pv,.ph button,#keys button,.pvh button.tb,#fab,.fi{zoom:var(--is)}
#act{--aw:46px;width:calc(var(--aw)*var(--is))}
@media(max-width:800px),(pointer:coarse){#act{--aw:56px}}
@media(max-width:800px){#side{left:calc(56px*var(--is))}}
#top button[data-m],.tab,.it,details>summary,.row button,input,select{font-size:calc(14px*var(--ts))}
#top button[data-m]{font-weight:550}
#menu div{font-size:calc(15px*var(--ts))}
label{font-size:calc(12.5px*var(--ts))}
.hit{font-size:calc(13px*var(--ts))}
#st{font-size:calc(12px*var(--ts))}
.ph{font-size:calc(11px*var(--ts));letter-spacing:.08em;font-weight:650}
@media(max-width:800px),(pointer:coarse){input,select{font-size:calc(16px*var(--ts))}}
#empty h2{font-weight:650;letter-spacing:-.01em;font-size:calc(20px*var(--ts))}
.it.on{background:color-mix(in srgb,var(--ac) 18%,transparent);box-shadow:inset 3px 0 var(--ac)}
#drop{background:color-mix(in srgb,var(--ac) 20%,transparent)}
#top button.pv,#fab{
  background:linear-gradient(135deg,#22c55e,#14b8a6);color:#04140a;
  box-shadow:0 0 14px #22c55e55,inset 0 1px 0 #fff5;
}
#top button.pv:hover,#fab:hover{background:linear-gradient(135deg,#22c55e,#14b8a6)}
#fab{box-shadow:0 0 20px #22c55e77,0 8px 20px #0007}
.sep{font-size:calc(11.5px*var(--ts));font-weight:650;letter-spacing:.06em;color:var(--mu);padding-top:8px;border-top:1px solid var(--bd);margin-top:4px}
label>span b{color:var(--ac);font-weight:650}
input[type=range]{padding:0;accent-color:var(--ac);background:transparent;border:0}
#ui_r{border:1px solid var(--bd);background:var(--hv);min-height:44px;padding:0 14px;font-weight:600}
#tn{--ic:var(--fg)}
#tn .ico{transition:transform .2s}
#tn.back .ico{transform:rotate(180deg)}
/* Tombol geser kanan (scroll cepat) */
#sln{display:none;position:absolute;right:2px;top:14px;bottom:96px;width:36px;z-index:11;touch-action:none}
#sln .tk{position:absolute;top:0;bottom:0;left:14px;right:14px;border-radius:6px;background:color-mix(in srgb,var(--fg) 9%,transparent)}
#slt{
  position:absolute;left:0;right:0;top:0;height:64px;border-radius:12px;display:grid;place-items:center;
  background:color-mix(in srgb,var(--sd) 88%,transparent);color:var(--ac);opacity:.6;transition:opacity .15s;
  border:1px solid color-mix(in srgb,var(--ac) 55%,var(--bd));box-shadow:0 4px 14px #0006;
}
#slt.on{opacity:1;background:color-mix(in srgb,var(--ac) 22%,var(--sd))}
#slt .ico{width:20px;height:20px;filter:none}
@media(max-width:800px),(pointer:coarse){#sln{display:block}body.nsl #sln{display:none}}
#sln.hid{display:none!important}
/* Glow mati */
body.ng .ico,body.ng #act button.on .ico,body.ng #top button.tb:hover .ico{filter:none!important}
body.ng #top button.pv,body.ng #fab,body.ng .lg,body.ng #top b.logo .mark,body.ng #keys button:hover,body.ng #toast{box-shadow:none!important}
body.ng #top b.logo{filter:none}
body.ng #act button.on{box-shadow:inset 3px 0 0 var(--ic,var(--ac))!important}
body.ng .fi,body.ng .it .fi,body.ng .tab.on .fi{box-shadow:0 0 0 1px #0003 inset!important}


/* ===== v1.4: gaya Formal (ala editor desktop), tanpa glow ===== */
body.fm{--bg:#1e1e1e;--sd:#252526;--br:#181818;--hv:#2a2d2e;--bd:#333333;--fg:#cccccc;--mu:#9d9d9d;
  --c1:#c5c5c5;--c2:#c5c5c5;--c3:#c5c5c5;--c4:#c5c5c5;--c5:#c5c5c5;--c6:#c5c5c5}
body.fm.l{--bg:#ffffff;--sd:#f3f3f3;--br:#ececec;--hv:#e4e6f1;--bd:#d4d4d4;--fg:#3b3b3b;--mu:#6b6b6b;
  --c1:#616161;--c2:#616161;--c3:#616161;--c4:#616161;--c5:#616161;--c6:#616161}
body.fm button,body.fm input,body.fm select,body.fm #keys button,body.fm .row button{border-radius:4px}
body.fm #act button{border-radius:0}
body.fm #act button.on{color:var(--ac);background:transparent;box-shadow:inset 2px 0 0 var(--ac)!important}
body.fm #act button:hover{color:var(--fg)}
body.fm #top{background:var(--br)}
body.fm #top button.tb:hover,body.fm .ph button:hover{color:var(--fg);background:var(--hv)}
body.fm #top button.pv,body.fm #fab{background:var(--ac);color:#fff;box-shadow:none;border-radius:4px}
body.fm #top button.pv:hover,body.fm #fab:hover{background:var(--ac);filter:brightness(1.12)}
body.fm #fab{border-radius:50%;box-shadow:0 2px 8px #0006!important}
body.fm #top b.logo{background:none;-webkit-text-fill-color:currentColor;color:var(--fg);font-weight:600;filter:none}
body.fm #top b.logo .mark{background:var(--ac);border-radius:4px;box-shadow:none}
body.fm .lg{background:var(--ac);border-radius:14px;box-shadow:none}
body.fm .lg::after{display:none}
body.fm #empty{background:var(--bg)}
body.fm #empty h2{font-weight:600}
body.fm .row button.primary{background:var(--ac);color:#fff;box-shadow:none}
body.fm #tabs{background:var(--br);padding-top:0;gap:0}
body.fm .tab{border-radius:0;border-right:1px solid var(--bd)}
body.fm .tab.on{background:var(--bg);box-shadow:inset 0 2px var(--ac)!important}
body.fm .it{border-radius:3px}
body.fm .it.on{background:color-mix(in srgb,var(--ac) 24%,transparent);box-shadow:none}
body.fm .fi{background-image:none;border-radius:3px;filter:saturate(.75)}
body.fm details>summary .fi-folder{color:#dcb67a;filter:none}
body.fm.l details>summary .fi-folder{color:#b8852f}
body.fm #st{background:var(--ac);color:#fff;border-top:0}
body.fm #st span+span{background:transparent}
body.fm #toast{background:var(--sd);color:var(--fg);border:1px solid var(--bd);border-left:3px solid var(--ac);border-radius:4px;box-shadow:0 4px 14px #0006}
body.fm #toast.err{border-left-color:var(--er)}
body.fm #menu{border-radius:6px;box-shadow:0 6px 20px #0008}
body.fm #slt{box-shadow:none;border-radius:6px}


/* ===== v1.5: tombol lipat sidebar ke kiri ===== */
#sc{
  position:fixed;transform:translateY(-50%);z-index:25;display:none;place-items:center;
  width:28px;height:64px;padding:0;background:var(--sd);color:var(--fg);

}
#sc .ico{width:18px;height:18px;filter:none}
#sc:hover,#sc:active{background:var(--hv);color:var(--ac)}
body.fm #sc{border-radius:0 6px 6px 0;box-shadow:2px 0 8px #0004}


/* ===== Logo FORGE (gambar ringan) ===== */
#top b.logo .mark{width:26px;height:26px;border-radius:6px;background:#000;object-fit:cover;box-shadow:0 0 0 1px #ffffff1f;filter:none;display:block}
.lg{width:120px;height:120px;border-radius:26px;background:#000;object-fit:cover;display:block;font:inherit;

.lg::after{display:none}

body.fm .lg{background:#000;border-radius:22px;box-shadow:0 0 0 1px #ffffff1a,0 12px 32px #0006}

  function addWs(path, entry) {
    path = path.replace(/\\/g, '/').replace(/^\/+/, '');

  async function openP(path) {
    if (!ed) return toast('Editor masih memuat…');
    if (files.has(path)) return show(path);

    const entry = ws.get(path);
    if (!entry) return toast('File tidak ditemukan: ' + path, true);

    loading(true, 'Membaca ' + path.split('/').pop() + '…');
    try {
      const text = await entry.read();
      const sample = text.slice(0, 8000);
      if (sample.includes('\0')) {
        if (!confirm('File tampak biner. Tetap buka sebagai teks?')) {
          loading(false);
          return;
        }
      }
      const model = monaco.editor.createModel(
        text,
        undefined,
        monaco.Uri.parse('file:///' + encodeURIComponent(path).replace(/%2F/g, '/'))
      );
      model.updateOptions({ tabSize: +S.tab });

      const f = {
        path,
        name: path.split('/').pop(),
        m: model,
        dirty: false,
        v: model.getAlternativeVersionId(),
        h: entry.handle || null
      };
      model.onDidChangeContent(() => {
        f.dirty = model.getAlternativeVersionId() !== f.v;
        tabs();
        updateStatus();
      });
      files.set(path, f);
      show(path);
    } catch (e) {
      toast('Gagal membuka: ' + (e.message || e), true);
    } finally {
      loading(false);
    }
  }

    model.updateOptions({ tabSize: +S.tab });
    const copy = { path, name: path.split('/').pop(), m: model, dirty: true, v: model.getAlternativeVersionId(), h: null };

  async function writeF(f) {
    const content = f.m.getValue();
    const FS = getFS();

    // File System Access API (Chrome desktop)
    if (!f.h && window.showSaveFilePicker && !FS) {
      try {
        f.h = await showSaveFilePicker({ suggestedName: f.name });
      } catch (e) {
        if (e.name === 'AbortError') throw e;
      }
    }

    if (f.h) {
      const w = await f.h.createWritable();
      await w.write(content);
      await w.close();
    } else if (FS) {
      const safePath = 'CodeForge/' + f.path.replace(/^\/+/, '');
      await FS.writeFile({
        path: safePath,
        data: content,
        directory: 'DOCUMENTS',
        encoding: 'utf8',
        recursive: true
      });
      toast('Disimpan: Documents/' + safePath);
    } else {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([content], { type: 'text/plain' }));
      a.download = f.name;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    }

    f.v = f.m.getAlternativeVersionId();
    f.dirty = false;
    tabs();
    updateStatus();
  }

  function tree() {
    const root = {};
    ws.forEach((_, p) => {
      let node = root;
      const parts = p.split('/');
      parts.slice(0, -1).forEach(x => {
        const key = x + '/';
        node[key] = node[key] || {};
        node = node[key];
      });
      node[parts[parts.length - 1]] = p;
    });

    const el = $('tree');
    el.innerHTML = '';
    if (!ws.size) {
      el.innerHTML = '<div class="hit"><small>Belum ada file. Buka file, folder, atau ZIP.</small></div>';
      return;
    }

    function build(node, parent, depth) {
      Object.keys(node).sort((a, b) => {
        const ad = a.endsWith('/'), bd = b.endsWith('/');
        if (ad !== bd) return bd - ad;
        return a.localeCompare(b);
      }).forEach(k => {
        if (k.endsWith('/')) {
          const d = document.createElement('details');
          d.open = depth < 2;
          const s = document.createElement('summary');
          s.innerHTML = svg('chev') + '<span class="fi-folder ico"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg></span> ' + k.slice(0, -1);
          const c = document.createElement('div');
          d.append(s, c);
          parent.appendChild(d);
          build(node[k], c, depth + 1);
        } else {
          const path = node[k];
          const d = document.createElement('div');
          d.className = 'it' + (path === act ? ' on' : '');
          d.innerHTML = '<b></b><span></span><button class="rm" title="Hapus dari workspace">' + svg('close') + '</button>';
          d.firstChild.innerHTML = ic(k);
          d.children[1].textContent = k;
          d.onclick = () => openP(path);
          d.querySelector('.rm').onclick = e => {
            e.stopPropagation();
            if (files.has(path)) close(path);
            ws.delete(path);
            tree();
          };
          parent.appendChild(d);
        }
      });
    }
    build(root, el, 0);
  }

  async function addFiles(list, openFirst) {

      if (SKIP.test(p)) continue;
      addWs(p, { size: f.size, read: () => f.text() });
      n++;

    }
    tree();
    toast(n + ' file dimuat');

        for (const h of handles) {

      ld('jszip.min.js', ok, () =>

  async function openZip(file) {
    if (!file) return;
    loading(true, 'Membuka ZIP…');
    try {
      await ensureJSZip();
      const z = await JSZip.loadAsync(file);
      let n = 0;
      const jobs = [];
      z.forEach((p, e) => {
        if (e.dir || SKIP.test(p)) return;
        jobs.push(
          Promise.resolve().then(() => {
            addWs(p, {
              size: (e._data && e._data.uncompressedSize) || 0,
              read: () => e.async('string')
            });
            n++;
          })
        );
      });
      await Promise.all(jobs);
      tree();
      toast(n + ' file dari ZIP');
      panel('p1');
    } catch (e) {
      toast('Gagal membuka ZIP: ' + (e.message || e), true);
    } finally {
      loading(false);
    }
  }

  async function dlZip() {
    if (!ws.size) return toast('Workspace kosong');
    loading(true, 'Membuat ZIP…');
    try {
      await ensureJSZip();
      const z = new JSZip();
      for (const [p, e] of ws) {
        const content = files.has(p) ? files.get(p).m.getValue() : await e.read();
        z.file(p, content);
      }
      const blob = await z.generateAsync({ type: 'blob' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'workspace.zip';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      toast('ZIP diunduh');
    } catch (e) {
      toast('Gagal ekspor: ' + (e.message || e), true);
    } finally {
      loading(false);
    }

  // ===== Preview kode =====
  const PV_RE = /\.(html?|svg|md|markdown|css|js|mjs|json)$/i;

  const readP = p => files.has(p) ? files.get(p).m.getValue() : (ws.has(p) ? ws.get(p).read() : null);

  function rel(base, ref) {
    if (/^(https?:|data:|blob:|\/\/|#)/i.test(ref)) return null;
    ref = ref.split(/[?#]/)[0];
    const dir = base.split('/').slice(0, -1).join('/');
    const out = [];
    (ref[0] === '/' ? ref : dir + '/' + ref).split('/').forEach(x => {
      if (!x || x === '.') return;
      if (x === '..') out.pop(); else out.push(x);
    });
    return out.join('/');
  }

  async function replaceAsync(str, re, fn) {
    const jobs = [];
    str.replace(re, (...a) => { jobs.push(fn(...a)); return ''; });
    const res = await Promise.all(jobs);
    let i = 0;
    return str.replace(re, () => res[i++]);
  }

  // Sisipkan CSS/JS lokal dari workspace ke dalam HTML
  async function inlineHtml(html, path) {
    html = await replaceAsync(html, /<link\b[^>]*?href=["']([^"']+)["'][^>]*>/gi, async (m, h) => {
      if (!/stylesheet/i.test(m)) return m;
      const p = rel(path, h), t = p ? await readP(p) : null;
      return t == null ? m : '<style>' + t + '\n</style>';
    });
    html = await replaceAsync(html, /<script\b([^>]*?)src=["']([^"']+)["']([^>]*)>\s*<\/script>/gi, async (m, a, src, b) => {
      const p = rel(path, src), t = p ? await readP(p) : null;
      return t == null ? m : '<script' + a + b + '>' + t.replace(/<\/script/gi, '<\\/script') + '<\/script>';
    });
    return html;
  }

  const ERR = '<script>addEventListener("error",function(e){var d=document.createElement("pre");d.style.cssText="position:fixed;left:0;right:0;bottom:0;margin:0;padding:10px 14px;background:#f85149;color:#fff;font:12px monospace;z-index:99999;white-space:pre-wrap";d.textContent="\u26A0 "+e.message+(e.lineno?" (baris "+e.lineno+")":"");document.body.appendChild(d)})<\/script>';
  const CON = '<script>(function(){var o=document.getElementById("o");function w(c,a){var d=document.createElement("div");d.className=c;d.textContent=[].map.call(a,function(x){try{return typeof x==="object"?JSON.stringify(x,null,2):String(x)}catch(e){return String(x)}}).join(" ");o.appendChild(d)}["log","info","warn","error"].forEach(function(k){var f=console[k];console[k]=function(){w(k,arguments);f.apply(console,arguments)}});addEventListener("error",function(e){w("error",["\u26A0 "+e.message+" (baris "+e.lineno+")"])})})()<\/script>';
  const inject = h => /<head[^>]*>/i.test(h) ? h.replace(/<head[^>]*>/i, m => m + ERR) : ERR + h;
  const wrap = (title, css, body, extra) =>
    '<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>' +
    title + '</title><style>' + css + '</style></head><body>' + body + (extra || '') + '</body></html>';

  function md(src) {
    const esc = t => t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const blocks = [];
    src = src.replace(/```(\w*)\n([\s\S]*?)```/g, (_, l, c) => {
      blocks.push('<pre><code>' + esc(c) + '</code></pre>');
      return '\u0001' + (blocks.length - 1) + '\u0001';
    });
    const inl = t => esc(t)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
      .replace(/\*([^*]+)\*/g, '<i>$1</i>')
      .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img alt="$1" src="$2">')
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
    const out = [];
    let list = null;
    const end = () => { if (list) { out.push('</' + list + '>'); list = null; } };
    src.split('\n').forEach(l => {
      let m;
      if ((m = l.match(/^(#{1,6})\s+(.*)/))) { end(); out.push('<h' + m[1].length + '>' + inl(m[2]) + '</h' + m[1].length + '>'); }
      else if ((m = l.match(/^\s*[-*+]\s+(.*)/))) { if (list !== 'ul') { end(); out.push('<ul>'); list = 'ul'; } out.push('<li>' + inl(m[1]) + '</li>'); }
      else if ((m = l.match(/^\s*\d+\.\s+(.*)/))) { if (list !== 'ol') { end(); out.push('<ol>'); list = 'ol'; } out.push('<li>' + inl(m[1]) + '</li>'); }
      else if ((m = l.match(/^>\s?(.*)/))) { end(); out.push('<blockquote>' + inl(m[1]) + '</blockquote>'); }
      else if (/^(-{3,}|\*{3,})\s*$/.test(l)) { end(); out.push('<hr>'); }
      else if (/^\u0001\d+\u0001$/.test(l.trim())) { end(); out.push(l.trim()); }
      else if (!l.trim()) end();
      else { end(); out.push('<p>' + inl(l) + '</p>'); }
    });
    end();
    return out.join('\n').replace(/\u0001(\d+)\u0001/g, (_, i) => blocks[i]);
  }

  function jsonHtml(t) {
    try {
      const j = JSON.stringify(JSON.parse(t), null, 2).replace(/&/g, '&amp;').replace(/</g, '&lt;');
      return '<pre>' + j.replace(/("(?:\\.|[^\\"])*"(\s*:)?|\b(?:true|false|null)\b|-?\d+(?:\.\d+)?(?:[eE][+\-]?\d+)?)/g, m => {
        const c = /^"/.test(m) ? (/:$/.test(m) ? 'k' : 's') : /^(true|false)$/.test(m) ? 'b' : m === 'null' ? 'z' : 'n';
        return '<span class="' + c + '">' + m + '</span>';
      }) + '</pre>';
    } catch (e) {
      return '<pre class="e">JSON tidak valid:\n' + e.message + '</pre>';
    }
  }

  async function buildPv(f) {
    const t = f.m.getValue();
    const x = f.name.split('.').pop().toLowerCase();
    if (x === 'htm' || x === 'html') return inject(await inlineHtml(t, f.path));
    if (x === 'svg') return wrap(f.name, 'html,body{margin:0;height:100%}body{display:grid;place-items:center;background:#fff}svg{max-width:100%;max-height:100vh;height:auto}', t);
    if (x === 'md' || x === 'markdown') return wrap(f.name, pvBase + pvTheme(), md(t));
    if (x === 'json') return wrap(f.name, pvBase + pvTheme() + '.k{color:#58a6ff}.s{color:#3fb950}.n{color:#d29922}.b{color:#ff7b72}.z{color:#8b949e}.e{color:#f85149}pre{white-space:pre-wrap}', jsonHtml(t));
    if (x === 'css') return wrap(f.name, 'body{margin:0;padding:20px;font-family:system-ui,sans-serif}',
      '<h1>Judul Halaman</h1><p>Paragraf contoh dengan <a href="#">tautan</a> dan <b>teks tebal</b>.</p><button>Tombol</button> <input placeholder="Input"><ul><li>Item satu</li><li>Item dua</li></ul>',

      '<div style="color:#7d8590">\u25B6 Output console</div><div id="o"></div>',

  function slSync() {
    if (!ed || slDrag || !act) return;
    const sln = $('sln'), th = $('slt');
    const room = Math.max(1, sln.clientHeight - th.offsetHeight);
    const max = Math.max(1, ed.getScrollHeight() - ed.getLayoutInfo().height);
    th.style.top = Math.min(room, Math.max(0, ed.getScrollTop() / max * room)) + 'px';
  }

  (function () {
    const sln = $('sln'), th = $('slt');
    const move = y => {
      if (!ed) return;
      const r = sln.getBoundingClientRect();
      const room = Math.max(1, sln.clientHeight - th.offsetHeight);
      const t = Math.min(Math.max(y - r.top - th.offsetHeight / 2, 0), room);
      th.style.top = t + 'px';
      ed.setScrollTop(t / room * Math.max(1, ed.getScrollHeight() - ed.getLayoutInfo().height));
    };
    sln.onpointerdown = e => {
      slDrag = true; sln.setPointerCapture(e.pointerId); th.classList.add('on');
      move(e.clientY); e.preventDefault();
    };
    sln.onpointermove = e => { if (slDrag) move(e.clientY); };
    sln.onpointerup = sln.onpointercancel = () => { slDrag = false; th.classList.remove('on'); };

    const bar = $('top');
    $('tn').onclick = () => {
      const end = bar.scrollLeft + bar.clientWidth >= bar.scrollWidth - 4;
      bar.scrollTo({ left: end ? 0 : bar.scrollLeft + bar.clientWidth * 0.6, behavior: 'smooth' });

  async function doSearch() {
    const q = $('sq').value;
    const r = $('sr');
    r.innerHTML = '';
    if (!q) return;

    const whole = $('sw').checked;
    let count = 0;
    const limit = 400;

    if (whole) {
      loading(true, 'Mencari di workspace…');
      try {
        for (const [p, e] of ws) {
          if (count >= limit) break;
          let text;
          if (files.has(p)) text = files.get(p).m.getValue();
          else {
            try { text = await e.read(); } catch (_) { continue; }
          }
          const lines = text.split(/\r?\n/);
          for (let i = 0; i < lines.length && count < limit; i++) {
            if (lines[i].toLowerCase().includes(q.toLowerCase())) {
              count++;
              const d = document.createElement('div');
              d.className = 'hit';
              d.innerHTML = '<small></small><br><span></span>';
              d.firstChild.textContent = p + ':' + (i + 1);
              d.lastChild.textContent = lines[i].trim().slice(0, 90);
              d.onclick = async () => {
                if (!files.has(p)) await openP(p);
                else show(p);
                ed.setPosition({ lineNumber: i + 1, column: 1 });
                ed.revealLineInCenter(i + 1);
              };
              r.appendChild(d);
            }
          }
        }
      } finally {
        loading(false);
      }
    } else {
      if (!ed) return;
      files.forEach((f, p) => {
        f.m.findMatches(q, false, false, false, null, false, 200).forEach(x => {
          if (count++ >= limit) return;
          const d = document.createElement('div');
          d.className = 'hit';
          d.innerHTML = '<small></small><br><span></span>';
          d.firstChild.textContent = f.name + ':' + x.range.startLineNumber;
          d.lastChild.textContent = f.m.getLineContent(x.range.startLineNumber).trim().slice(0, 90);
          d.onclick = () => {
            show(p);
            ed.setSelection(x.range);
            ed.revealLineInCenter(x.range.startLineNumber);
          };
          r.appendChild(d);
        });
      });
    }

    if (!count) r.innerHTML = '<div class="hit"><small>Tidak ada hasil</small></div>';
  }

  function forkGitHubRepo() {
    const input = prompt('Masukkan URL repositori GitHub yang ingin di-fork (contoh: https://github.com/pemilik/proyek):');
    if (!input) return;
    let url;
    try { url = new URL(input.trim().startsWith('http') ? input.trim() : 'https://' + input.trim()); }
    catch (_) { alert('URL tidak valid. Masukkan URL repositori GitHub.'); return; }
    const parts = url.pathname.split('/').filter(Boolean);
    if (url.hostname.toLowerCase() !== 'github.com' || parts.length < 2) {
      alert('Masukkan URL repositori GitHub dengan format github.com/pemilik/nama-repo.');
      return;
    }
    const owner = parts[0], repo = parts[1].replace(/\.git$/i, '');
    openExternal('https://github.com/' + encodeURIComponent(owner) + '/' + encodeURIComponent(repo) + '/fork');
  }

  });

  // Drag & drop folder/file
  async function walk(entry, base) {
    if (entry.isFile) {
      return new Promise(r => {
        entry.file(f => {
          if (!SKIP.test(base + entry.name)) {
            addWs(base + entry.name, { size: f.size, read: () => f.text() });
          }
          r();
        });
      });
    }
    const reader = entry.createReader();
    const all = [];
    for (;;) {
      const batch = await new Promise(r => reader.readEntries(r));
      if (!batch.length) break;
      all.push(...batch);
    }
    for (const child of all) {
      await walk(child, base + entry.name + '/');
    }
  }

  ['dragenter', 'dragover'].forEach(ev =>
    addEventListener(ev, e => {
      e.preventDefault();
      $('drop').style.display = 'flex';
    })
  );
  addEventListener('dragleave', e => {
    if (!e.relatedTarget) $('drop').style.display = 'none';
  });
  addEventListener('drop', async e => {
    e.preventDefault();
    $('drop').style.display = 'none';
    const items = [...e.dataTransfer.items]
      .map(i => i.webkitGetAsEntry && i.webkitGetAsEntry())
      .filter(Boolean);
    if (items.length) {
      loading(true, 'Memuat folder…');
      try {
        for (const x of items) await walk(x, '');
        tree();
        toast(ws.size + ' item di workspace');
      } finally {
        loading(false);
      }
    } else {
      await addFiles(e.dataTransfer.files, true);
    }
  });

  addEventListener('beforeunload', e => {
    if ([...files.values()].some(f => f.dirty)) {
      e.preventDefault();
      e.returnValue = '';
    }
  });

  // Keyboard: Escape closes menu / side on mobile
  addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (!$('pv').hidden) closePv();
      $('menu').style.display = 'none';
      if (innerWidth < 800) $('side').classList.remove('open');
    }
  });
})();
</script>
</body>
</html>
