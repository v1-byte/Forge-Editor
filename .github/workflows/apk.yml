name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*.*.*"]
    paths-ignore:
      - '**.md'
      - '.gitignore'

jobs:
  apk:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies & prepare Android
        run: |
          npm ci || npm install
          npm run android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CodeForge-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" android/app/build/outputs/apk/debug/app-debug.apk \
            --title "CodeForge $GITHUB_REF_NAME" \
            --notes "APK Android CodeForge. File ini dibuat oleh GitHub Actions sebagai debug build."
