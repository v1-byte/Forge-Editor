name: Build APK

# - push ke main/master            -> APK debug
# - push tag v*  (mis. v1.9.0)     -> APK rilis bertanda tangan + AAB + GitHub Release
# - Run workflow (manual)          -> pilih debug / release

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Jenis build
        type: choice
        options: [debug, release]
        default: debug
  push:
    branches: [main, master]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - '.gitignore'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      BUILD_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type || (startsWith(github.ref, 'refs/tags/v') && 'release' || 'debug') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies (salin Monaco + JSZip ke www/)
        run: npm ci || npm install

      - name: Verifikasi Monaco terbundel
        run: npm run verify

      - name: Tag harus sama dengan versi package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${V}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} tidak sama dengan versi package.json (v${V}). Jalankan 'npm version patch|minor|major' lalu push tag-nya."
            exit 1
          fi

      - name: Siapkan proyek Android (ikon, splash, versi)
        run: npm run android

      # ---------- DEBUG ----------
      - name: Build APK debug
        if: env.BUILD_TYPE == 'debug'
        run: |
          node scripts/android.js debug-flags
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK debug
        if: env.BUILD_TYPE == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: CodeForge-APK-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # ---------- RELEASE ----------
      - name: Siapkan keystore
        if: env.BUILD_TYPE == 'release'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in KS_B64 KS_PASS KEY_ALIAS KEY_PASS; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret untuk ${v} belum diisi (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD)."
              exit 1
            fi
          done
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            echo "CF_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore"
            echo "CF_KEYSTORE_PASSWORD=$KS_PASS"
            echo "CF_KEY_ALIAS=$KEY_ALIAS"
            echo "CF_KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"

      - name: Build APK + AAB rilis
        if: env.BUILD_TYPE == 'release'
        run: |
          node scripts/android.js signing
          node scripts/android.js guard-release
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Verifikasi tanda tangan APK
        if: env.BUILD_TYPE == 'release'
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          V=$(node -p "require('./package.json').version")
          mkdir -p dist
          cp "$APK" "dist/CodeForge-${V}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "dist/CodeForge-${V}.aab"

      - name: Upload APK + AAB rilis
        if: env.BUILD_TYPE == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: CodeForge-release
          path: dist/*
          if-no-files-found: error

      - name: GitHub Release
        if: env.BUILD_TYPE == 'release' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
