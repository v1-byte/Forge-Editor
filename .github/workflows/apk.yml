name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*.*.*"]
    paths-ignore:
      - '**.md'
      - '.gitignore'

jobs:
  apk:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies and prepare Android
        run: |
          npm ci
          npm run android

      - name: Configure stable release signing
        if: startsWith(github.ref, 'refs/tags/')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node configure-android-signing.js

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeForge-APK-${{ github.run_number }}
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" android/app/build/outputs/apk/release/app-release.apk \
            --title "CodeForge $GITHUB_REF_NAME" \
            --notes "APK ditandatangani dengan kunci rilis stabil. Pengguna v1.5.3 atau lebih lama perlu uninstall versi lama dan memasang versi ini sekali; setelah itu, rilis yang ditandatangani dengan kunci yang sama dapat diperbarui di atas instalasi. Android tetap meminta persetujuan pengguna untuk pemasangan."
